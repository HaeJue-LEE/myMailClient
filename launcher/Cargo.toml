[package]
name = "mailclient-launcher"
version = "0.1.1"
edition = "2021"
publish = false
description = "Unpacks Mail Client next to itself on first run, then starts it"

# No dependencies: only the standard library and Windows' own DLLs.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
